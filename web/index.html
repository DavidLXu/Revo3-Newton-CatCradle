<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revo3 · 翻花绳 / Newton</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7e2;color:#262a2a;font:14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}header{position:absolute;top:34px;left:42px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:2.8px;color:#68716e}h1{font-size:34px;font-weight:500;letter-spacing:-1px;margin:12px 0 8px}.sub{font-size:13px;color:#727874;line-height:1.8}
.badge{position:absolute;right:40px;top:40px;border:1px solid #abb6ad;border-radius:30px;padding:9px 14px;font-size:11px;letter-spacing:1px;background:#f7f7f280}.dot{display:inline-block;width:6px;height:6px;background:#46705b;border-radius:50%;margin-right:7px}
#readout{position:absolute;left:42px;bottom:156px}.phase{font-size:19px;font-weight:500;margin-bottom:10px}.meta{font:11px ui-monospace,monospace;color:#6e7771;line-height:1.8}
.controls{position:absolute;bottom:30px;left:40px;right:40px;background:#ffffffb8;backdrop-filter:blur(16px);padding:18px 22px;border-radius:14px;border:1px solid #ffffff;box-shadow:0 8px 40px #323d3610}.row{display:flex;align-items:center;gap:14px}button,select{background:#f3f4ef;border:1px solid #d5dcd4;color:#36473b;padding:8px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}button:hover{background:#dce4db}#play{background:#345441;color:white;border-color:#345441;min-width:65px}#seek{flex:1;accent-color:#385b43}#time{font:12px ui-monospace,monospace;width:103px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:#7b827b}.footer label{cursor:pointer}.hint{position:absolute;right:42px;bottom:157px;color:#818980;font-size:11px}#error{position:absolute;top:200px;left:42px;color:#a33333;max-width:500px}input[type=checkbox]{accent-color:#416649}
@media(max-width:700px){header{top:22px;left:22px}h1{font-size:26px}.badge{display:none}.controls{left:15px;right:15px;bottom:16px}.hint{display:none}#readout{left:22px}.footer span{max-width:70%}.row{gap:6px}button{padding:8px}.sub{font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head><body>
<div id="scene"></div><header><div class="eyebrow">BRAINCO REVO3 / NEWTON PHYSICS</div><h1>指间翻花绳 · 正向</h1><div class="sub" id="source">正在加载关节记录…</div></header>
<div class="badge"><span class="dot"></span>XPBD · CPU SIMULATION</div>
<div id="readout"><div class="phase" id="phase">正在加载仿真…</div><div class="meta" id="meta"></div></div>
<div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div id="error"></div>
<div class="controls"><div class="row"><button id="play">播放</button><input id="seek" type="range" min="0" max="120" value="0" step="1" aria-label="仿真时间"><span id="time">0.00 / 4.00 s</span><select id="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select><button id="camera">正面</button></div><div class="footer"><span>无固定挂点 · 碰撞与摩擦驱动 · Newton 仿真轨迹回放</span></div></div>
<script type="module" src="./viewer.js"></script></body></html>
