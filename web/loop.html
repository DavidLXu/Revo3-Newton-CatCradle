<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revo3 · Cat's Cradle</title>
  <style>
    html,body{height:100%;margin:0;background:#dce1e0}
    body{display:grid;place-items:center}
    video{display:block;width:100%;height:100%;object-fit:contain}
  </style>
</head>
<body>
  <video controls autoplay loop muted playsinline preload="auto"
    poster="../output/cycle_speed_1_5/landscape_silver/cover.png"
    aria-label="Revo3 forward and inverse cat's cradle loop">
    <source src="../output/cycle_speed_1_5/landscape_silver/revo3_cycle_final.mp4" type="video/mp4">
  </video>
  <script>
    // The previous portrait recording remains available without rerendering.
    if(new URLSearchParams(location.search).get('layout')==='portrait') {
      const video=document.querySelector('video');
      video.poster='../output/cycle_speed_1_5/portrait_english/cover.png';
      video.querySelector('source').src='../output/cycle_speed_1_5/portrait_english/revo3_cycle_final.mp4';
      video.load();
    }
  </script>
</body>
</html>
