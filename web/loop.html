<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revo3 · Cat's Cradle</title>
  <style>
    html,body{height:100%;margin:0;background:#14161a}
    body{display:grid;place-items:center}
    video{display:block;width:100%;height:100%;object-fit:contain}
  </style>
</head>
<body>
  <video controls autoplay loop muted playsinline preload="auto"
    poster="../output/cycle_speed_1_5/landscape_dark/cover.png"
    aria-label="Revo3 forward and inverse cat's cradle loop">
    <source src="../output/cycle_speed_1_5/landscape_dark/revo3_cycle_final.mp4" type="video/mp4">
  </video>
  <script>
    // Previous recordings remain available without rerendering.
    const query=new URLSearchParams(location.search);
    const previous=query.get('layout')==='portrait' ? 'portrait_english'
      : query.get('theme')==='light' ? 'landscape_silver' : null;
    if(previous) {
      const video=document.querySelector('video');
      document.body.style.background='#dce1e0';
      video.poster=`../output/cycle_speed_1_5/${previous}/cover.png`;
      video.querySelector('source').src=`../output/cycle_speed_1_5/${previous}/revo3_cycle_final.mp4`;
      video.load();
    }
  </script>
</body>
</html>
